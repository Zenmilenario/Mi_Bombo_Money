<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mi Bombo Money — Tu dinero, con perspectiva</title>
  <desc id="desc">Portada en grafito y verde agua con una ilustración abstracta de cuentas y evolución financiera. No representa datos reales.</desc>
