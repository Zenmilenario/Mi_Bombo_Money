name: Validar app iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar MiPatrimonio (${{ matrix.configuration }} - ${{ matrix.sdk }} - ${{ matrix.edition }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sdk: iphonesimulator
            destination: "generic/platform=iOS Simulator"
            edition: personal
          - configuration: Release
            sdk: iphoneos
            destination: "generic/platform=iOS"
            edition: personal
          - configuration: Release
            sdk: iphoneos
            destination: "generic/platform=iOS"
            edition: publica

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Comprobar proyecto y esquema
        run: |
          plutil -lint MiPatrimonio/Resources/Info.plist MiPatrimonio.xcodeproj/project.pbxproj
          xcodebuild -list -project MiPatrimonio.xcodeproj

      - name: Compilar app
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          SDK: ${{ matrix.sdk }}
          DESTINATION: ${{ matrix.destination }}
          EDITION: ${{ matrix.edition }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$EDITION" = "publica" ]; then EXTRA+=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) DOBLON_PUBLIC"); fi
          xcodebuild \
            -project MiPatrimonio.xcodeproj \
            -scheme MiPatrimonio \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            clean build | tee xcodebuild.log

      - name: Comprimir la aplicacion del simulador
        if: matrix.sdk == 'iphonesimulator'
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontro la aplicacion compilada."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" MiPatrimonio-Simulator.zip

      - name: Guardar aplicacion compilada
        if: matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@v7
        with:
          name: MiPatrimonio-iOS-Simulator
          path: MiPatrimonio-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Guardar registro de compilacion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Registro-compilacion-Xcode-${{ matrix.configuration }}-${{ matrix.sdk }}-${{ matrix.edition }}
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
