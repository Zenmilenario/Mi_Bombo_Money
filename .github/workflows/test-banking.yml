name: Comprobar conexión bancaria de prueba

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-policy:
    name: Destinos y retorno de autorización iOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar política de conexión del cliente
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/banking-client-check
          xcrun swiftc -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Security/AppAuthenticationPolicy.swift \
            MiPatrimonio/Core/Services/BankingConnectionPolicy.swift \
            Tests/BankingSecurityCheck.swift \
            -o build/banking-client-check/BankingSecurityCheck
          build/banking-client-check/BankingSecurityCheck

  workspace:
    name: Integración bancaria en la app de prueba
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar importación, cálculos, repetición y aislamiento
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/banking-workspace-check
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macosx14.0" -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Shared/Formatting.swift \
            MiPatrimonio/Core/Services/FinanceCalculator.swift \
            MiPatrimonio/Core/Services/CategoryDefaultsService.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            MiPatrimonio/Core/Services/BankingConnectionModels.swift \
            MiPatrimonio/Core/Services/BankingWorkspaceImporter.swift \
            Tests/BankingWorkspaceCheck.swift \
            -o build/banking-workspace-check/BankingWorkspaceCheck
          build/banking-workspace-check/BankingWorkspaceCheck

  banking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BankingBackend
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: BankingBackend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:integration
      - run: npm run check
