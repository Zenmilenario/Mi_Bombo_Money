name: Comprobar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Pruebas y APK de Doblón para Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: doblon_android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar la parte nativa de Android
        shell: bash
        run: |
          set -euo pipefail
          # The native projects are committed (generated with Flutter on the development PC).
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android:label="Doblón"' "$MANIFEST"
          grep -q 'mibombomoney-bank' "$MANIFEST"
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas con datos ficticios
        run: flutter test

      - name: Compilar el APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p ../build/android
          cp build/app/outputs/flutter-apk/app-release.apk "../build/android/Doblon-Android-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          {
            echo "## APK de Doblón para Android"
            echo ""
            echo "- Versión: \`${VERSION}\` (ejecución ${GITHUB_RUN_NUMBER})"
            echo "- Descarga el artefacto **Doblon-Android-APK**, ábrelo en el móvil y permite instalar desde esa fuente."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el APK
        uses: actions/upload-artifact@v7
        with:
          name: Doblon-Android-APK
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 30
