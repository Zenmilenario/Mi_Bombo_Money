name: Comprobar almacenamiento cloud

on:
  workflow_dispatch:
  push:
    paths: ['supabase/**', 'CloudBackend/**', 'MiPatrimonio/Core/Cloud/**', 'Tests/Cloud*', '.github/workflows/test-cloud.yml', 'MiPatrimonio/Core/Services/**', 'MiPatrimonio/Core/Models/**', 'MiPatrimonio/App/**', 'MiPatrimonio/Features/Settings/**', 'MiPatrimonio/Resources/CloudConfiguration.json']
  pull_request:
    paths: ['supabase/**', 'CloudBackend/**', 'MiPatrimonio/Core/Cloud/**', 'Tests/Cloud*', '.github/workflows/test-cloud.yml', 'MiPatrimonio/Core/Services/**', 'MiPatrimonio/Core/Models/**', 'MiPatrimonio/App/**', 'MiPatrimonio/Features/Settings/**', 'MiPatrimonio/Resources/CloudConfiguration.json']

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL y aislamiento de usuarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUD_TEST_ADMIN_DSN: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r CloudBackend/requirements-test.txt
      - run: python supabase/tests/test_finance.py

  client:
    name: Sesiones y combinación de datos cloud
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar protocolo, acceso y conflictos
        run: |
          mkdir -p build/cloud-check
          xcrun swiftc -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Cloud/CloudDocument.swift \
            MiPatrimonio/Core/Cloud/CloudClient.swift \
            MiPatrimonio/Core/Cloud/CloudPKCEFlow.swift \
            MiPatrimonio/Core/Cloud/CloudAutomaticSync.swift \
            Tests/CloudProtocolCheck.swift -o build/cloud-check/CloudProtocolCheck
          build/cloud-check/CloudProtocolCheck
      - name: Comprobar integración con SwiftData
        run: |
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macosx14.0" -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Shared/Formatting.swift \
            MiPatrimonio/Core/Services/BackupService.swift \
            MiPatrimonio/Core/Security/PasswordKeyDerivation.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            MiPatrimonio/Core/Services/CategoryDefaultsService.swift \
            MiPatrimonio/Core/Cloud/CloudDocument.swift \
            MiPatrimonio/Core/Cloud/CloudClient.swift \
            MiPatrimonio/Core/Cloud/CloudBackupAdapter.swift \
            Tests/CloudPersistenceCheck.swift -o build/cloud-check/CloudPersistenceCheck
          build/cloud-check/CloudPersistenceCheck
