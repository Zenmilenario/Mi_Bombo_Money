name: Comprobar datos y cálculos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-policy:
    name: Configuración y cobertura de los checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python Tests/check_ci_workflows.py

  backup:
    name: Exportación y restauración
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Compilar y probar exportacion y restauracion
        run: |
          mkdir -p build/backup-check
          xcrun swiftc \
            -target "$(uname -m)-apple-macosx14.0" \
            -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Core/Services/ReservedLedger.swift \
            MiPatrimonio/Core/Services/BackupService.swift \
            MiPatrimonio/Core/Security/PasswordKeyDerivation.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            Tests/BackupRoundTripCheck.swift \
            -o build/backup-check/BackupRoundTripCheck
          build/backup-check/BackupRoundTripCheck

  finance:
    name: Cálculos y movimientos automáticos
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Compilar y probar servicios financieros
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/finance-check
          xcrun swiftc \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx14.0" \
            -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Core/Services/ReservedLedger.swift \
            MiPatrimonio/Shared/Formatting.swift \
            MiPatrimonio/Core/Services/FinanceCalculator.swift \
            MiPatrimonio/Core/Services/TransactionPresentation.swift \
            MiPatrimonio/Core/Services/DashboardAlertReviewState.swift \
            MiPatrimonio/Core/Services/DuplicateDetectionService.swift \
            MiPatrimonio/Core/Services/RecurringMovementService.swift \
            MiPatrimonio/Core/Services/CategoryDefaultsService.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            MiPatrimonio/Core/Services/CSVImportService.swift \
            Tests/FinancialLogicCheck.swift \
            -o build/finance-check/FinancialLogicCheck
          build/finance-check/FinancialLogicCheck

      - name: Comprobar bandeja de revisión
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macosx14.0" -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Core/Services/ReservedLedger.swift \
            MiPatrimonio/Core/Services/TransactionReviewService.swift \
            MiPatrimonio/Core/Services/DuplicateDetectionService.swift \
            Tests/TransactionReviewCheck.swift -o build/finance-check/TransactionReviewCheck
          build/finance-check/TransactionReviewCheck

      - name: Comprobar aprendizaje de categorías con datos ficticios
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Services/TransactionCategoryModel.swift \
            Tests/TransactionCategoryModelCheck.swift -o build/finance-check/TransactionCategoryModelCheck
          build/finance-check/TransactionCategoryModelCheck

      - name: Comprobar filas adaptables sin espacios vacíos
        run: python3 Tests/check_adaptive_layout.py

      - name: Comprobar IA de tipos de operación y abstención
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Services/TransactionOperationModel.swift \
            Tests/TransactionOperationModelCheck.swift -o build/finance-check/TransactionOperationModelCheck
          build/finance-check/TransactionOperationModelCheck

      - name: Comprobar persistencia y aislamiento del aprendizaje de operaciones
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -target "$(uname -m)-apple-macosx14.0" -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Core/Services/ReservedLedger.swift \
            MiPatrimonio/Core/Services/TransactionOperationModel.swift \
            MiPatrimonio/Core/Services/TransactionOperationLearning.swift \
            MiPatrimonio/Core/Services/TransactionCorrectionModel.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            MiPatrimonio/Core/Services/DuplicateDetectionService.swift \
            Tests/TransactionOperationLearningCheck.swift -o build/finance-check/TransactionOperationLearningCheck
          build/finance-check/TransactionOperationLearningCheck

      - name: Comprobar aprendizaje temporal de correcciones completas
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Services/TransactionOperationModel.swift \
            MiPatrimonio/Core/Services/TransactionCorrectionModel.swift \
            Tests/TransactionCorrectionModelCheck.swift -o build/finance-check/TransactionCorrectionModelCheck
          build/finance-check/TransactionCorrectionModelCheck

      - name: Comprobar aplicación segura y deshacer de correcciones aprendidas
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -target "$(uname -m)-apple-macosx14.0" -parse-as-library \
            MiPatrimonio/Core/Models/Models.swift \
            MiPatrimonio/Core/Services/ReservedLedger.swift \
            MiPatrimonio/Core/Services/CategoryRuleService.swift \
            MiPatrimonio/Core/Services/DuplicateDetectionService.swift \
            MiPatrimonio/Core/Services/TransactionOperationModel.swift \
            MiPatrimonio/Core/Services/TransactionCorrectionModel.swift \
            MiPatrimonio/Core/Services/TransactionOperationLearning.swift \
            Tests/TransactionAutomaticCorrectionCheck.swift -o build/finance-check/TransactionAutomaticCorrectionCheck
          build/finance-check/TransactionAutomaticCorrectionCheck

  passwords:
    name: Contraseñas y separación de acceso bancario
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verificar derivación de claves y permisos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/password-check
          xcrun swiftc -swift-version 5 -parse-as-library \
            MiPatrimonio/Core/Security/PasswordKeyDerivation.swift \
            MiPatrimonio/Core/Security/AppAuthenticationPolicy.swift \
            Tests/PasswordSecurityCheck.swift \
            -o build/password-check/PasswordSecurityCheck
          build/password-check/PasswordSecurityCheck
